# kitty の設定。操作の一覧は docs/howtouse/kitty.md、設計判断は docs/architecture/kitty.md。
#
# このファイルは mkOutOfStoreSymlink でリポジトリを直接指す symlink なので、編集は rebuild
# なしで反映される (kitty 側の再読込は ctrl+shift+f5)。配線は ../kitty.nix。

# フォント名は Nix が生成する font.conf から取る (../kitty.nix の terminalFont)。
# include は symlink の指す先ではなく、このファイルが置かれた ~/.config/kitty/ を基準に
# 解決されるので、生成物と symlink を同じディレクトリに共存させられる。
include font.conf
font_size 15.0

background_opacity 0.75
enabled_layouts splits,stack

# smart-splits.nvim の kitty backend が kitty @ を使うためのソケット。backend は
# KITTY_LISTEN_ON の有無で自分が有効かを判定するので、listen_on は必須。
# socket-only は TTY 経由の遠隔操作だけを拒否するので、端末に流し込まれたエスケープ列で
# 操作される経路を塞ぎつつ、このソケットは使える。PID は kitty が末尾に付ける。
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty.sock

# kitty はスクロールバックの検索も vi 風の選択も持たないので Neovim に渡す。
# この行は nvim_open_term が読み込み済みバッファを端末チャンネルへ転送する 0.12 以降でのみ
# 動く。0.11 では画面が空になる (overlays/unstable-packages.nix を参照)。
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# 階層キー  w = タブ内ウィンドウ / t = タブ / o = OS ウィンドウ
# 動詞キー  c 作る / f フォーカス / e 並べ替え / m 別の入れ物へ移す / r サイズ / x 閉じる
#
# 18 マス中 3 マスは構造的に空く。OS ウィンドウには移す先の上位階層が無く、並べ替えは
# ウィンドウマネージャの領分で、タブは表示領域を OS ウィンドウから受け取るので固有の
# サイズを持たない。空欄に別の操作を当てない。

# --- タブ内ウィンドウ ---
map ctrl+a>w>c launch --location=vsplit --cwd=current
map ctrl+a>w>f focus_visible_window
map ctrl+a>w>e swap_with_window
map ctrl+a>w>m detach_window ask
map ctrl+a>w>r start_resizing_window
map ctrl+a>w>x close_window_with_confirmation

# 行き先を選ばずに移す別名
map ctrl+a>w>[ detach_window tab-left
map ctrl+a>w>] detach_window tab-right
map ctrl+a>w>n detach_window new-tab
map ctrl+a>w>o detach_window new

# --- タブ ---
map ctrl+a>t>c new_tab_with_cwd
map ctrl+a>t>f select_tab
map ctrl+a>t>e move_tab_forward
map ctrl+a>t>shift+e move_tab_backward
map ctrl+a>t>m detach_tab ask
map ctrl+a>t>n detach_tab new
map ctrl+a>t>x close_tab

# --- OS ウィンドウ ---
map ctrl+a>o>c new_os_window_with_cwd
map ctrl+a>o>f nth_os_window -1
map ctrl+a>o>x close_os_window

# --- 短縮形（wezterm での手癖を維持） ---
map ctrl+a>s launch --location=hsplit --cwd=current
map ctrl+a>v launch --location=vsplit --cwd=current
map ctrl+a>c new_tab_with_cwd
map ctrl+a>n next_tab
map ctrl+a>shift+n previous_tab
map ctrl+a>x close_window_with_confirmation
map ctrl+a>e layout_action rotate
map ctrl+a>y show_scrollback
map ctrl+a>ctrl+a send_key ctrl+a

# --- 一覧を開く: ctrl+a>? ---
# このファイルの map 行と見出しをそのまま重ねて表示する。kitty 組み込みの debug_config
# (ctrl+shift+f6) はキー列を先頭トリガーでまとめるため、ctrl+a 始まりの 30 個が 1 行に
# 潰れて読めない。定義そのものを出所にすれば一覧が実態からずれない。
# 一覧からは、この map 行自身と、smart-splits の割当て解除行 (動作を持たない) を落とす。
map ctrl+a>? launch --type=overlay --window-title キー割当て sh -c 'grep -E "^(map |# -)" "${XDG_CONFIG_HOME:-$HOME/.config}/kitty/kitty.conf" | grep -vE -- "--when-focus-on|^map ctrl\+a>\?" | less -R'

# --- 透明度（wezterm では Lua 関数だったものをネイティブ action へ置換） ---
map ctrl+equal set_background_opacity +0.05
map ctrl+minus set_background_opacity -0.05
map ctrl+0     set_background_opacity 0.75

# --- smart-splits: Neovim と kitty の分割を同じキーで行き来する ---
# Neovim がフォーカスを持つ間は割当てを外してキーをそのまま渡す。IS_NVIM は
# smart-splits が起動時に立てる kitty の user var。
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

map alt+h kitten relative_resize.py left  3
map alt+j kitten relative_resize.py down  3
map alt+k kitten relative_resize.py up    3
map alt+l kitten relative_resize.py right 3
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+l
