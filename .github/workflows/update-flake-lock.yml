name: Update flake.lock
'on':
  schedule:
    # 09:17 JST on Mondays.
    - cron: '17 0 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Open a PR on main after checking the updated lock file
        type: boolean
        default: false
permissions: {}
concurrency:
  group: update-flake-lock
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      lock: ${{ steps.update.outputs.lock }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-nix
      - name: Test the lock update policy
        run: python3 tests/flake-lock-update.py
      - name: Update and evaluate the candidate lock
        id: update
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo 'flake.lock is already current.'
            exit 0
          fi
          python3 scripts/ci/check-lock-update.py <(git show HEAD:flake.lock) flake.lock >> "$GITHUB_STEP_SUMMARY"
          bash scripts/ci/check-package-set.sh nixos-spin713 nixos-desktop
          printf 'lock=%s\n' "$(base64 -w0 flake.lock)" >> "$GITHUB_OUTPUT"
  open-pr:
    needs: update
    if: needs.update.outputs.lock != '' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Open a lock-only PR if one is not already open
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_B64: ${{ needs.update.outputs.lock }}
        run: |
          open=$(gh pr list --base main --state open --limit 100 \
            --json isCrossRepository,headRefName \
            --jq 'map(select((.isCrossRepository | not) and (.headRefName | startswith("automation/flake-lock-")))) | length')
          if (( open > 0 )); then
            echo 'An automated flake.lock update PR is already open.'
            exit 0
          fi
          branch="automation/flake-lock-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$LOCK_B64" | base64 --decode > flake.lock
          summary=$(python3 scripts/ci/check-lock-update.py <(git show HEAD:flake.lock) flake.lock)
          body=$(mktemp "$RUNNER_TEMP/flake-lock-pr.XXXXXX")
          {
            printf '%s\n\n' 'Generated by nix flake update. Both package sets passed evaluation; full builds and activation have not been verified.'
            printf '```text\n'
            git diff --stat -- flake.lock
            printf '```\n\n%s\n' "$summary"
          } > "$body"
          git add -- flake.lock
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(flake): update locked inputs'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title 'chore(flake): update locked inputs' \
            --body-file "$body"
