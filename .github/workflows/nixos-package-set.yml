name: NixOS package-set evaluation
'on':
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package-set:
    name: Package set (${{ matrix.host }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host: [nixos-spin713, nixos-desktop]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Test the lock update policy
        run: python3 tests/flake-lock-update.py
      - uses: ./.github/actions/install-nix
      - name: Test GCS cache publishing with a temporary signing key
        if: matrix.host == 'nixos-spin713'
        run: nix shell --inputs-from . nixpkgs#age nixpkgs#sops nixpkgs#jq -c bash tests/flake-cache-publisher.sh
      - name: Evaluate system.path (not the full system)
        env:
          NIXOS_HOST: ${{ matrix.host }}
        run: bash scripts/ci/check-package-set.sh "$NIXOS_HOST"
