name: Build and publish NixOS cache
'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify:
        description: Check WIF and VM access without building or changing the channel
        type: boolean
        default: false
      smoke:
        description: Test publishing in the separate smoke bucket with an ephemeral key
        type: boolean
        default: false
      update_worker:
        description: Rebuild and stage the flake-cache-worker NixOS generation for next boot
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: flake-cache-worker
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (vars.FLAKE_CACHE_PUBLISH_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.verify || inputs.smoke || inputs.update_worker)))
    runs-on: ubuntu-24.04
    timeout-minutes: 310
    steps:
      - name: Reject conflicting manual dispatch options
        if: github.event_name == 'workflow_dispatch' && inputs.update_worker && (inputs.verify || inputs.smoke)
        run: |
          echo 'update_worker cannot be combined with verify or smoke.' >&2
          exit 2
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.FLAKE_CACHE_PROJECT }}
          workload_identity_provider: ${{ vars.FLAKE_CACHE_WIF_PROVIDER }}
          service_account: ${{ vars.FLAKE_CACHE_CONTROLLER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Verify access to the dedicated VM without starting it
        if: github.event_name == 'workflow_dispatch' && inputs.verify
        env:
          CACHE_VM_ZONE: ${{ vars.FLAKE_CACHE_ZONE }}
        run: gcloud compute instances describe flake-cache-worker --zone="$CACHE_VM_ZONE" --format='value(status)'
      - uses: ./.github/actions/install-nix
        if: github.event_name == 'workflow_dispatch' && inputs.smoke
      - name: Exercise WIF and GCS with an ephemeral signing key
        if: github.event_name == 'workflow_dispatch' && inputs.smoke
        timeout-minutes: 10
        env:
          CACHE_SMOKE_BUCKET: ${{ vars.FLAKE_CACHE_SMOKE_BUCKET }}
        run: bash scripts/ci/smoke-cache-release.sh
      - name: Update the dedicated worker NixOS generation for next boot
        if: github.event_name == 'workflow_dispatch' && inputs.update_worker && !inputs.verify && !inputs.smoke
        env:
          CACHE_BUCKET: ${{ vars.FLAKE_CACHE_BUCKET }}
          CACHE_VM_ZONE: ${{ vars.FLAKE_CACHE_ZONE }}
          WORKER_MODE: update-worker
        run: bash scripts/ci/control-cache-worker.sh
      - name: Build the exact commit and promote the successful release
        if: github.event_name != 'workflow_dispatch' || (!inputs.verify && !inputs.smoke && !inputs.update_worker)
        env:
          CACHE_BUCKET: ${{ vars.FLAKE_CACHE_BUCKET }}
          CACHE_VM_ZONE: ${{ vars.FLAKE_CACHE_ZONE }}
          WORKER_MODE: build
        run: bash scripts/ci/control-cache-worker.sh
