# 架空のホスト（tests/hosts）が使う持ち主の値。
# テスト用の設定ディレクトリでは実在のホストも生成するので、実在のホストが読むキーをすべて持つ。
git_username = "Alice"
git_email = "alice@example.org"
agent_config_root = "config"
agent_config_repo = "git@example.org:test/config.git"
lan_public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFakeKeyForTestsOnly000000000000000000000000 test@lan"
agent_compression = { caveman = "off", genshijin = "normal" }
secrets = [{ secret = "gemini_api_key", path = ".config/gemini/api-key" }]
