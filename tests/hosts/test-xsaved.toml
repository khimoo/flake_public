system = "x86_64-linux"
state_version = "25.11"
timezone = "Asia/Tokyo"
hostname = "test-xsaved"
data_device = "/dev/disk/by-uuid/test-data"


[[users]]
name = "alice"
purposes = ["machine_base", "serve_xsaved", "nixos_system", "etc_nixos_link"]

[users.xsaved]
database = "xsaved_alice"
data_subvolume = "@xsaved-alice"
backup_repository = "rclone:test:xsaved-alice"
proxy_name = "alice.xsaved.localhost"

[[users]]
name = "bob"
purposes = ["machine_base", "serve_xsaved", "nixos_system"]

[users.xsaved]
database = "xsaved_bob"
web_port = 8775
data_subvolume = "@xsaved-bob"
backup_repository = "rclone:test:xsaved-bob"
proxy_name = "bob.xsaved.localhost"
