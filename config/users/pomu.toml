git_username = "khimoo"
git_email = "dailysentence1111@gmail.com"
agent_config_root = "sagyo/agents-private"
agent_config_repo = "git@github.com:khimoo/agents-private.git"
agent_compression = { caveman = "off", genshijin = "normal" }
secrets = [{ secret = "gemini_api_key", path = ".config/gemini/api-key" }]
# gemini-proofread が Gemini の API で校正できないときの予備の経路（antigravity-cli）と、Alook の CLI。
repo_packages = ["packages/antigravity-cli", "packages/alook"]
# 自分用サーバ（purposes に run_home_server を書いたホスト）。クライアントの要素（quaderno_backup、xsaved_client）が ssh で接続する。
home_server = "nixos-desktop"
