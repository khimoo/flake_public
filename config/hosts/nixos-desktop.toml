hostname = "nixos-desktop"
system = "x86_64-linux"
kind = "nixos"
state_version = "25.05"
timezone = "Asia/Tokyo"
machine = "machine_nixos_desktop"
xkb_layout = "us+altgr-intl"
backup_dir = "/mnt/backup"
data_device = "/dev/disk/by-uuid/57ba3e14-4099-4708-a643-edfc45d3eb18"
turbo_interval_ms = 40
echo_cancel_source = "alsa_input.usb-Kingston_HyperX_SoloCast-00.analog-stereo"
private_repos = [
  { url = "git@github.com:khimoo/llm-wikis.git", dest = "sagyo/llm-wikis" },
  { url = "git@github.com:khimoo/xsaved.git", dest = "sagyo/xsaved" },
]
minecraft_repo = "/mnt/backup/minecraft/repo"
minecraft_remote = "gdrive:minecraft-backups"
quaderno_archive = "/mnt/backup/quaderno"
mimikopi_data_subvolume = "@mimikopi"
mimikopi_hsa_override = "10.3.0"
windows_vm_domain = "win11"
windows_vm_images_subvolume = "@vm"

[[users]]
name = "pomu"
purposes = [
  # 勉強
  "grow_notes",
  "read_materials",
  "follow_communities",
  # 趣味
  "programming",
  "draw",
  "media",
  "make_music",
  "game",
  "game_development",
  "communicate",
  # 生活管理
  "web_procedures",
  "write_documents",
  "write_doc_with_windows",
  "manage_data",
  "organize_mail",
  # 仕事
  "work_ss",
  "work_fr",
  # このマシンが引き受けること
  "run_home_server",
  "etc_nixos_link",
  # 利用者の個人のファイルと秘密
  "personal_files",
]
admin = true

# pomu が動かす xsaved（serve_xsaved）の値。
[users.xsaved]
data_subvolume = "@xsaved"
database = "xsaved"
hsa_override = "10.3.0"
web_port = 8765
check_mount = true
backup_repository = "rclone:gdrive:xsaved-backup"
proxy_name = "xsaved.localhost"

