hostname = "nixos-desktop"
system = "x86_64-linux"
kind = "nixos"
state_version = "25.05"
timezone = "Asia/Tokyo"
ssh_user = "pomu"
machine = "machine_nixos_desktop"
xkb_layout = "us+altgr-intl"
backup_dir = "/mnt/backup"
data_device = "/dev/disk/by-uuid/57ba3e14-4099-4708-a643-edfc45d3eb18"
turbo_interval_ms = 40
echo_cancel_source = "alsa_input.usb-Kingston_HyperX_SoloCast-00.analog-stereo"
lan_ssh = true
private_repos = [
  { url = "git@github.com:khimoo/llm-wikis.git", dest = "sagyo/llm-wikis" },
  { url = "git@github.com:khimoo/xsaved.git", dest = "sagyo/xsaved" },
]
minecraft_repo = "/mnt/backup/minecraft/repo"
minecraft_remote = "gdrive:minecraft-backups"
quaderno_archive = "/mnt/backup/quaderno"
mimikopi_data_dir = "/home/pomu/.local/share/mimikopi"
mimikopi_data_subvolume = "@mimikopi"
mimikopi_hsa_override = "10.3.0"
secrets = [{ secret = "xsaved_restic_password", path = ".config/xsaved/restic-password" }]
windows_vm_domain = "win11"
windows_vm_images_subvolume = "@vm"
xsaved_proxy = { user = "pomu", name = "xsaved.localhost" }

# デスクトップのスレッド数。デスクトップ自身の max-jobs もこの値になる。
# スロットが埋まると、呼び出し側は手元でビルドするか（local_builds = true）、空きを待つ。
# supported_features はデスクトップ自身の system-features にも足される。載せていない
# feature を要求する derivation（big-parallel の LLVM など）は、ここに回らない。
[builder]
max_jobs = 32
supported_features = ["benchmark", "big-parallel", "kvm", "nixos-test"]

[[users]]
name = "pomu"
purposes = [
  # 勉強
  "grow_notes",
  "read_materials",
  "follow_communities",
  # 趣味
  "programming",
  "draw",
  "media",
  "make_music",
  "game",
  "game_development",
  "communicate",
  # 生活管理
  "web_procedures",
  "write_documents",
  "write_doc_with_windows",
  "manage_data",
  "organize_mail",
  # 仕事
  "work_ss",
  "work_fr",
  # このマシンが引き受けること
  "run_home_server",
  "etc_nixos_link",
  # 利用者の個人のファイルと秘密
  "personal_files",
]
admin = true

[[users]]
name = "mase"
purposes = []
admin = false
home_manager = false
initial_hashed_password = "$6$jQHubQo9MXPX15.x$LSWMJBiOQT75T/HOeMyKlFmWZjl.wTi7CA.m02uFPPJqssvKCMq1..6fGYdjm7HMJhhBAIl1Vbpkuq92gaVbH/"

[xsaved_users.pomu]
data_dir = "/home/pomu/.local/share/xsaved"
data_subvolume = "@xsaved"
project_dir = "/home/pomu/.local/share/xsaved-app"
database = "xsaved"
hsa_override = "10.3.0"
web_port = 8765
check_mount = true
backup_repository = "rclone:gdrive:xsaved-backup"
backup_password_file = "/home/pomu/.config/xsaved/restic-password"
