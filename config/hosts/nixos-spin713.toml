hostname = "nixos-spin713"
system = "x86_64-linux"
kind = "nixos"
state_version = "25.05"
timezone = "Asia/Tokyo"
machine = "machine_nixos_spin713"
xkb_layout = "us+altgr-intl"
text_scaling_factor = 1.25
# ビルドはデスクトップに回す。このマシンは 4 スレッドで、/nix も SD カード上にある。
# デスクトップに繋がらないときに黙って手元でビルドさせず、失敗させて人が判断する。
local_builds = false
echo_cancel_source = "alsa_input.platform-avs_dmic.19.auto.stereo-fallback"
quaderno_bluetooth = "34:6F:24:3E:5F:3C"
private_repos = [{ url = "git@github.com:khimoo/llm-wikis.git", dest = "sagyo/llm-wikis" }]

nix_uuid = "35e48f86-290c-43f3-9567-f677f2f98a4e"
swap_device = "/dev/disk/by-uuid/ad09652b-13f2-455f-8614-1488908f71dd"
keyd_ids = ["k:0001:0001", "k:18d1:5044", "k:18d1:5052", "k:0000:0000", "k:18d1:5050", "k:18d1:504c", "k:18d1:503c", "k:18d1:5030", "k:18d1:503d", "k:18d1:505b", "k:18d1:5057", "k:18d1:502b", "k:18d1:5061"]

[[users]]
name = "pomu"
purposes = [
  # 勉強
  "grow_notes",
  "read_materials",
  "follow_communities",
  # 趣味
  "programming",
  "program_on_home_server",
  "draw",
  "media",
  "communicate",
  # 生活管理
  "web_procedures",
  # このマシンが引き受けること
  "etc_nixos_link",
  # 利用者の個人のファイルと秘密
  "personal_files",
]
admin = true

