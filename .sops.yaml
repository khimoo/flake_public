# sops の受信者(recipients)定義。secrets/ 配下の暗号文を「どの age 鍵で復号できるか」を決める。
#
# この repo は専用 age 鍵を 1 本だけ使う(NixOS / home-manager / 全マシン共通)。同じ鍵が:
#   - 復号の種      … 各マシンの ~/.config/sops/age/keys.txt に out-of-band で設置
#                     (既存マシンから SSH 送信、または Bitwarden から取得)
#   - 暗号文の編集鍵 … secret を追加・更新する人間が使う
# ホスト鍵は使わない(root しか読めず home-manager から扱えないため)。
#
# fork して自分用に使うなら、この鍵を自分のものに差し替える:
#   nix shell nixpkgs#age -c age-keygen -o ~/.config/sops/age/keys.txt
#   # 出力される "Public key: age1..." を下の &deploy へ。keys.txt 自体はコミットしない。
#
# secret(GitHub 登録済みユーザー SSH 鍵)の入れ方は
# docs/howtouse/private-repo-clone.md を参照。
keys:
  - &deploy age16afyxp6j00p54nfuzgrxheagxplvghwj34jcllq0xshq500w2p9snzmasf

creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *deploy
